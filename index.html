<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Exponents — 1981–2001</title>

    <!-- Connects this HTML file to style.css -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="player">

        <!-- ==================== ARTWORK ==================== -->

        <section class="artwork-section">

            <div class="artwork" id="artwork">

                <div class="artwork-year" id="artworkYear">
                    1981
                </div>

                <div class="artwork-placeholder">
                    <span>THE</span>
                    <strong>EXPONENTS</strong>
                </div>

            </div>

        </section>


        <!-- ==================== EVENT INFORMATION ==================== -->

        <section class="information">

            <div class="year" id="year">
                1981
            </div>

            <div class="event-title" id="eventTitle">
                Dance Exponents form in Christchurch
            </div>

            <div class="event-description" id="eventDescription">
                The band forms in Christchurch, beginning the story that
                would eventually lead to some of New Zealand's best-known
                rock songs.
            </div>

            <div class="metadata">

                <span id="location">
                    CHRISTCHURCH, NEW ZEALAND
                </span>

                <span>•</span>

                <span id="category">
                    FORMATION
                </span>

            </div>

        </section>


        <!-- ==================== CONTROLS ==================== -->

        <section class="controls">

            <button
                class="control-button"
                id="previousButton"
                aria-label="Previous year">
                ⏮
            </button>

            <button
                class="play-button"
                id="playButton"
                aria-label="Play timeline">
                ▶
            </button>

            <button
                class="control-button"
                id="nextButton"
                aria-label="Next year">
                ⏭
            </button>

        </section>


        <!-- ==================== TIMELINE ==================== -->

        <section class="timeline-section">

            <div class="timeline-labels">

                <span>1981</span>

                <span id="currentTimelineYear">
                    1981
                </span>

                <span>2001</span>

            </div>

            <input
                type="range"
                id="timeline"
                min="1981"
                max="2001"
                value="1981"
                step="1"
                aria-label="Timeline year">

        </section>


        <!-- ==================== FOOTER ==================== -->

        <footer>

            <div>
                THE EXPONENTS
            </div>

            <div>
                1981 — 2001
            </div>

        </footer>

    </main>


    <!-- Connects this HTML file to script.js -->
    <script src="script.js"></script>

</body>

</html>
